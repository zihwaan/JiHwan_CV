<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사과 게임</title>
    <link href="https://webfontworld.github.io/pretendard/Pretendard.css" rel="stylesheet">
    <!-- 1. Load Original Game CSS FIRST -->
    <link rel="stylesheet" crossorigin href="/game-assets/assets/index-CshUSUt8.css">
    <!-- 2. Load My Override CSS SECOND -->
    <link rel="stylesheet" href="/apple-game-style.css">
</head>
<body>

    <div class="page-wrapper">
        <header class="page-header">
            <h1>사과 게임</h1>
            <a href="/index.html" class="back-link">← 돌아가기</a>
        </header>

        <main class="main-content">
            <!-- This column holds the original, unmodified game structure -->
            <div class="game-column">
                <div id="game-container">
                    <div id="grid-container">
                        <div id="grid"></div>
                        <div id="selection-box" class="hidden"></div>
                        <div id="splash-screen">
                            <h1>사과 게임</h1>
                            <p>재미있는 사과 게임에 오신 것을 환영합니다!</p>
                            <p>시작 버튼을 눌러 게임을 시작하세요.</p>
                        </div>
                        <div id="result-modal" class="hidden">
                            <div class="modal-content">
                                <h1>게임 종료</h1>
                                <p>최종 점수: <span id="final-score"></span></p>
                                <form id="leaderboard-form">
                                    <input type="text" id="leaderboard-name" placeholder="이름 (10자 이내)" required maxlength="10">
                                    <input type="text" id="leaderboard-message" placeholder="한 줄 소감 (30자 이내)" required maxlength="30">
                                    <button type="submit">리더보드에 등록</button>
                                </form>
                                <button id="close-button">닫기</button>
                            </div>
                        </div>
                    </div>
                    <div id="sidebar">
                        <button id="start-button">게임 시작</button>
                        <button id="auto-solve-button" disabled>자동 풀기</button>
                        <div id="score-container">
                            <h2>점수: <span id="score">0</span></h2>
                        </div>
                        <div id="timer-container">
                            <div id="timer-bar-container">
                                <div id="timer-bar"></div>
                                <span id="time-remaining">120</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- This column holds the new UI elements -->
            <div class="info-column">
                <div id="leaderboard-container">
                    <h2>🏆 리더보드</h2>
                    <ol id="leaderboard-list"></ol>
                </div>
                <div class="how-to-play">
                    <h2>게임 방법</h2>
                    <ul>
                        <li><strong>목표:</strong> 마우스로 사과들을 드래그하여 합이 10이 되는 그룹을 만드세요.</li>
                        <li><strong>점수:</strong> 합이 10이 되면 선택된 사과들이 사라지며 점수를 얻습니다.</li>
                        <li><strong>시간:</strong> 제한 시간은 2분입니다. 시간이 다 되면 게임이 종료됩니다.</li>
                    </ul>
                </div>
            </div>
        </main>
    </div>

    <!-- 3. Load Original Game JS FIRST -->
    <script type="module" crossorigin src="/game-assets/assets/index-Ds9_MN2s.js"></script>
    <!-- 4. Load My Augmenting JS SECOND -->
    <script type="module" src="/apple-game.js"></script>

</body>
</html>
