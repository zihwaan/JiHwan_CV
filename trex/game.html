<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>지환 러너 (T-Rex Game)</title>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="../assets/img/증사.ico" />
    <!-- Fonts & Icons -->
    <script src="https://use.fontawesome.com/releases/v6.1.0/js/all.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <!-- Common Styles -->
    <link href="../css/styles.css" rel="stylesheet" />
    
    <style>
        body {
            background-color: #f7f7f7;
            font-family: "Pretendard", sans-serif;
            overflow-x: hidden;
            user-select: none;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 300px;
            margin: 0 auto;
            background-color: #fff;
            border-bottom: 2px solid #535353;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #auth-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        #game-ui {
            text-align: center;
            margin-top: 20px;
        }
        .score-board {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: 30px auto;
        }
        .score-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }
        .score-item:last-child { border-bottom: none; }
        .rank-badge {
            width: 24px;
            height: 24px;
            background: #333;
            color: #fff;
            border-radius: 50%;
            text-align: center;
            line-height: 24px;
            font-size: 12px;
            margin-right: 10px;
        }
        .user-info { display: flex; align-items: center; gap: 10px; }
        .user-avatar { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; }
        .navbar-brand {
            font-family: "Pretendard", sans-serif;
            font-weight: 700;
        }
    </style>
    <!-- Kakao SDK -->
    <script src="https://developers.kakao.com/sdk/js/kakao.js"></script>
    <script>
        window.KAKAO_JS_KEY = '9fd1b882e2cee4f435584bb9c3e3761c'; 
    </script>
    <meta name="kakao-key" content="9fd1b882e2cee4f435584bb9c3e3761c">
</head>
<body>
    <!-- Nav -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-black fixed-top shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="../index.html">지환닷컴</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarResponsive">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="../index.html#hub">돌아가기</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container" style="padding-top: 100px;">
        <div class="text-center mb-4">
            <h1 class="fw-bold">🏃 지환 러너</h1>
            <p class="text-muted">장애물을 피하고 최고 점수에 도전하세요!</p>
        </div>

        <!-- Game Area -->
        <div id="game-container" class="rounded shadow-sm">
            <canvas id="gameCanvas"></canvas>

            <!-- Login/Start Overlay -->
            <div id="auth-overlay">
                <div id="login-msg" class="text-center">
                    <h3 class="mb-3">로그인이 필요합니다</h3>
                    <p class="mb-4">기록 저장을 위해 카카오 로그인을 해주세요.</p>
                    <button id="kakao-login-btn" class="btn btn-warning btn-lg">
                        <i class="fas fa-comment"></i> 카카오 로그인
                    </button>
                </div>
                <div id="start-msg" class="text-center d-none">
                    <h3 class="mb-3">준비되셨나요?</h3>
                    <p>스페이스바 또는 화면을 터치하여 점프하세요!</p>
                    <button id="start-btn" class="btn btn-primary btn-lg">게임 시작</button>
                    <p class="mt-3 text-muted small">내 최고 점수: <span id="my-best-score">0</span></p>
                </div>
                <div id="game-over-msg" class="text-center d-none">
                    <h3 class="mb-2">게임 오버!</h3>
                    <p class="fs-4 fw-bold mb-4">점수: <span id="current-score">0</span></p>
                    
                    <!-- Top 10 Message Input -->
                    <div id="top10-section" class="d-none mb-3">
                        <div class="alert alert-warning animate__animated animate__pulse animate__infinite">
                            🎉 <b>축하합니다! TOP 10 진입!</b> 🎉
                        </div>
                        <p class="small text-muted">명예의 전당에 남길 소감을 적어주세요.</p>
                        <textarea id="top10-message" class="form-control mb-2" rows="2" maxlength="50" placeholder="소감을 입력하세요 (최대 50자)"></textarea>
                        <button id="submit-msg-btn" class="btn btn-warning w-100 mb-2">소감 등록</button>
                    </div>

                    <button id="restart-btn" class="btn btn-dark btn-lg">다시 하기</button>
                </div>
            </div>
        </div>

        <!-- Leaderboard -->
        <div class="score-board">
            <h4 class="fw-bold mb-3 text-center"><i class="fas fa-trophy text-warning"></i> 명예의 전당 (Top 10)</h4>
            <div id="leaderboard-list">
                <div class="text-center py-3 text-muted">
                    <div class="spinner-border spinner-border-sm" role="status"></div> 로딩 중...
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
