<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나노바나나 - 지환닷컴</title>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="../assets/img/증사.ico" />
    
    <!-- Libraries -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://use.fontawesome.com/releases/v6.1.0/js/all.js" crossorigin="anonymous"></script>

    <link href="../css/styles.css" rel="stylesheet" />

    <style>
        body {
            background-color: #fff9c4; /* Banana yellow tint */
            padding-top: 0;
            min-height: 100vh;
        }
        .container-main {
            max-width: 600px;
            margin: 2rem auto;
            background: #fff;
            padding: 2rem;
            border-radius: 1.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .upload-area {
            border: 2px dashed #ffd54f;
            border-radius: 1rem;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #fffde7;
        }
        .upload-area:hover {
            background-color: #fff9c4;
            border-color: #fbc02d;
        }
        .upload-area img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 0.5rem;
            display: none;
        }
        .btn-banana {
            background-color: #fbc02d;
            color: #fff;
            font-weight: bold;
            border: none;
            transition: transform 0.2s;
        }
        .btn-banana:hover {
            background-color: #f9a825;
            transform: scale(1.02);
            color: #fff;
        }
        .result-box {
            display: none;
            text-align: center;
            margin-top: 2rem;
            animation: fadeIn 0.5s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .generated-svg {
            width: 300px;
            height: 300px;
            margin: 0 auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-radius: 1rem;
            padding: 1rem;
            background: #fafafa;
        }
        .spinner-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            display: none;
            flex-direction: column;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-black shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html">지환닷컴</a>
            <span class="navbar-text text-white-50">나노바나나 🍌</span>
        </div>
    </nav>

    <div class="container container-main">
        <div class="text-center mb-4">
            <h1 class="fw-bold display-6">🍌 나노바나나 프로필 메이커</h1>
            <p class="text-muted">당신의 사진과 성격으로 귀여운 캐릭터를 만들어보세요!</p>
        </div>

        <form id="banana-form">
            <!-- Image Upload -->
            <div class="mb-4">
                <label class="form-label fw-bold">1. 사진을 올려주세요</label>
                <div class="upload-area" id="drop-zone">
                    <input type="file" id="file-input" accept="image/*" hidden>
                    <div id="upload-placeholder">
                        <i class="fas fa-cloud-upload-alt fa-3x text-warning mb-2"></i>
                        <p class="mb-0 text-muted">터치하여 사진 선택</p>
                    </div>
                    <img id="preview-img" alt="Preview">
                </div>
            </div>

            <div class="row g-3 mb-4">
                <!-- Gender -->
                <div class="col-md-6">
                    <label class="form-label fw-bold">2. 성별</label>
                    <select class="form-select" id="gender" required>
                        <option value="Male">남성</option>
                        <option value="Female">여성</option>
                        <option value="Non-binary">기타</option>
                    </select>
                </div>

                <!-- MBTI -->
                <div class="col-md-6">
                    <label class="form-label fw-bold">3. MBTI</label>
                    <select class="form-select" id="mbti" required>
                        <option value="INTJ">INTJ</option>
                        <option value="INTP">INTP</option>
                        <option value="ENTJ">ENTJ</option>
                        <option value="ENTP">ENTP</option>
                        <option value="INFJ">INFJ</option>
                        <option value="INFP">INFP</option>
                        <option value="ENFJ">ENFJ</option>
                        <option value="ENFP">ENFP</option>
                        <option value="ISTJ">ISTJ</option>
                        <option value="ISFJ">ISFJ</option>
                        <option value="ESTJ">ESTJ</option>
                        <option value="ESFJ">ESFJ</option>
                        <option value="ISTP">ISTP</option>
                        <option value="ISFP">ISFP</option>
                        <option value="ESTP">ESTP</option>
                        <option value="ESFP">ESFP</option>
                    </select>
                </div>
            </div>

            <!-- Personality -->
            <div class="mb-4">
                <label class="form-label fw-bold">4. 성격 키워드 (간단히)</label>
                <input type="text" class="form-control" id="personality" placeholder="예: 활발함, 독서광, 고양이상..." required>
            </div>

            <button type="submit" class="btn btn-banana w-100 py-3 fs-5 rounded-pill shadow-sm">
                <i class="fas fa-magic me-2"></i> 캐릭터 생성하기
            </button>
        </form>

        <!-- Result -->
        <div id="result-box" class="result-box">
            <h3 class="fw-bold mb-3">✨ 당신의 나노바나나 캐릭터 ✨</h3>
            <div id="svg-container" class="generated-svg d-flex align-items-center justify-content-center">
                <!-- SVG will be injected here -->
            </div>
            <p class="text-muted mt-3 small">이미지가 생성되었습니다. (서버에 자동 저장됨)</p>
            <button class="btn btn-outline-dark mt-2" onclick="location.reload()">다시 만들기</button>
            <a href="../index.html" class="btn btn-link mt-2 text-decoration-none">홈으로 가기</a>
        </div>
    </div>

    <!-- Loading Spinner -->
    <div id="loading-spinner" class="spinner-overlay">
        <div class="spinner-border text-warning" style="width: 3rem; height: 3rem;" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-3 fw-bold text-dark">AI가 열심히 그림을 그리고 있어요... 🍌<br>(약 10~20초 소요)</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
