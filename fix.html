<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>지환닷컴 Web Terminal</title>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="assets/img/증사.ico" />
    
    <!-- Xterm.js CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet" />
    <script src="https://use.fontawesome.com/releases/v6.1.0/js/all.js" crossorigin="anonymous"></script>

    <style>
        html, body {
            height: 100dvh;
            margin: 0;
            background-color: #000;
            color: #ccc;
            font-family: "Pretendard", sans-serif;
            overflow: hidden;
        }
        #terminal-container {
            width: 100%;
            height: calc(100% - 50px); /* Minus navbar height */
            padding: 10px;
            box-sizing: border-box;
        }
        .navbar {
            height: 50px;
            background-color: #1a1a1a;
            border-bottom: 1px solid #333;
            padding: 0 1rem;
        }
        .xterm-viewport {
            overflow-y: auto !important;
        }
    </style>
    
    <script src="https://developers.kakao.com/sdk/js/kakao.js"></script>
    <script>window.KAKAO_JS_KEY = '9fd1b882e2cee4f435584bb9c3e3761c';</script>
</head>
<body>
    <nav class="navbar navbar-dark d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-2">
            <a href="https://zihwan.com" class="btn btn-sm btn-primary fw-bold">zihwan.com</a>
            <i class="fas fa-terminal text-success ms-2"></i>
            <span class="text-white fw-bold">Web Terminal</span>
            <span id="status-badge" class="badge bg-secondary">Disconnected</span>
        </div>
        <div class="d-flex gap-2">
            <button id="auth-btn" class="btn btn-sm btn-outline-warning">로그인 필요</button>
        </div>
    </nav>

    <div id="terminal-container"></div>

    <!-- Auth Modal -->
    <div class="modal fade" id="authModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-light border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title">시스템 접속</h5>
                </div>
                <div class="modal-body text-center">
                    <p class="mb-4">터미널 접속을 위해 인증이 필요합니다.</p>
                    <button id="kakao-login-btn" class="btn btn-warning w-100 fw-bold mb-3">
                        <i class="fas fa-comment"></i> 카카오 로그인
                    </button>
                    
                    <div id="admin-code-section" class="mt-3 d-none">
                        <hr class="border-secondary">
                        <p class="small text-muted">관리자 보안 코드를 입력하세요.</p>
                        <form id="admin-code-form">
                            <input type="password" id="admin-code" class="form-control bg-black text-white border-secondary mb-2" placeholder="Access Code" autocomplete="off">
                            <button type="submit" class="btn btn-success w-100 btn-sm">접속</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.2/dist/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
    <script src="js/fix.js"></script>
</body>
</html>
