<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>지환닷컴 Agent Controller</title>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="assets/img/증사.ico" />
    <!-- Fonts & Icons -->
    <script src="https://use.fontawesome.com/releases/v6.1.0/js/all.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <script src="https://developers.kakao.com/sdk/js/kakao.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: "Pretendard", sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 15px;
            line-height: 1.5;
            word-wrap: break-word;
            font-size: 0.95rem;
        }
        .message.user {
            align-self: flex-end;
            background-color: #0d6efd; /* Bootstrap Primary */
            color: white;
            border-bottom-right-radius: 2px;
        }
        .message.agent {
            align-self: flex-start;
            background-color: #2c2c2c;
            color: #e0e0e0;
            border-bottom-left-radius: 2px;
            border: 1px solid #444;
        }
        .message.system {
            align-self: center;
            background-color: transparent;
            color: #888;
            font-size: 0.8rem;
            text-align: center;
        }
        .input-area {
            background-color: #1e1e1e;
            padding: 15px;
            border-top: 1px solid #333;
        }
        .terminal-log {
            font-family: 'Courier New', Courier, monospace;
            background: #000;
            color: #0f0;
            padding: 10px;
            border-radius: 5px;
            font-size: 0.8rem;
            margin-top: 5px;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
        .navbar {
            background-color: #1e1e1e !important;
            border-bottom: 1px solid #333;
        }
    </style>
    <script>
        window.KAKAO_JS_KEY = '9fd1b882e2cee4f435584bb9c3e3761c';
    </script>
</head>
<body>
    <nav class="navbar navbar-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1"><i class="fas fa-robot me-2"></i>Gemini Agent Controller</span>
            <button id="auth-btn" class="btn btn-sm btn-outline-warning">로그인 필요</button>
        </div>
    </nav>

    <div id="chat-box" class="chat-container">
        <div class="message system">시스템에 접속했습니다. 카카오 로그인을 진행해주세요.</div>
    </div>

    <div class="input-area">
        <form id="command-form" class="d-flex gap-2">
            <input type="text" id="command-input" class="form-control bg-dark text-light border-secondary" placeholder="지시할 작업을 입력하세요..." disabled>
            <button type="submit" id="send-btn" class="btn btn-primary" disabled><i class="fas fa-paper-plane"></i></button>
        </form>
    </div>

    <!-- Auth Modal -->
    <div class="modal fade" id="authModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-light">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title">관리자 인증</h5>
                </div>
                <div class="modal-body text-center">
                    <p class="mb-4">이 페이지는 시스템 관리자 전용입니다.</p>
                    <button id="kakao-login-btn" class="btn btn-warning w-100 fw-bold">
                        <i class="fas fa-comment"></i> 카카오 로그인
                    </button>
                    <div id="admin-code-section" class="mt-3 d-none">
                        <hr class="border-secondary">
                        <p class="small text-muted">최초 1회 관리자 코드를 입력하세요.</p>
                        <input type="password" id="admin-code" class="form-control bg-black text-white border-secondary mb-2" placeholder="Admin Code">
                        <button id="verify-admin-btn" class="btn btn-outline-light w-100 btn-sm">인증</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/fix.js"></script>
</body>
</html>
