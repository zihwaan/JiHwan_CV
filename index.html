    <style>
        .avatar{
            width: 36px;

        :root{

            --fg: #111;
            --accent: #000;
        }   
        html, body{
            font-family: "Pretendard", sans-serif;
            background: var(--bg);
            color: var(--fg);
            scroll-behavior: auto;
        }
        .masthead{
            padding: 8rem 0 5rem;

            color: #fff;

            width: 200px;
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(0,0,0,.35);
        }        
        .feature-card{
            border: 1px solid var(--fg);
            border-radius: 1rem;
            padding: 2rem;
            height: 100%;
            transition: all .3s ease;
            cursor: pointer;
            background: #fff;
            text-decoration: none !important;
            color: inherit;
            position: relative;
        }
        .feature-card:hover{
            transform: translateY(-6px);
            box-shadow: 0 8px 20px rgba(0,0,0,.12);
        }
        .feature-card.locked{
            border-style: dashed;
            background: #fafafa;
        }
        .feature-card .lock-badge{
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: #000;
            color: #fff;
            font-size: .7rem;
            padding: .2rem .55rem;
            border-radius: 999px;
            font-weight: 600;
            letter-spacing: .01em;
            display: inline-flex;

        .feature-icon{

        body {

        .navbar-brand {
