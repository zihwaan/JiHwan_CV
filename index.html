<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>지환닷컴</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="assets/img/증사.ico" />

    <!-- Icon & Font -->
    <script src="https://use.fontawesome.com/releases/v6.1.0/js/all.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        .avatar{
            width: 36px; 
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
        }
        .comment-text{
            white-space: pre-line;
            font-family: inherit;
            line-height: 1.4;
            word-break: break-word;
        }
        .admin-delete {
            min-width: 36px;
            height: 36px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .admin-delete:hover {
            background-color: #dc3545;
            color: white;
            border-color: #dc3545;
        }
        :root{
            --bg: #fff;
            --fg: #111;
            --accent: #000;
        }   
        html, body{
            font-family: "Pretendard", sans-serif;
            background: var(--bg);
            color: var(--fg);
            scroll-behavior: auto;
        }
        .masthead{
            padding: 8rem 0 5rem;
            background: #000;
            color: #fff;
            text-align: center;
        }
        .masthead-avatar{
            width: 200px;
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(0,0,0,.35);
        }        
        .feature-card{
            border: 1px solid var(--fg);
            border-radius: 1rem;
            padding: 2rem;
            height: 100%;
            transition: all .3s ease;
            cursor: pointer;
            background: #fff;
            text-decoration: none !important;
            color: inherit;
        }
        .feature-card:hover{
            transform: translateY(-6px);
            box-shadow: 0 8px 20px rgba(0,0,0,.12);
        }        
        .feature-icon{
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--accent);
        }        
        #guestbook-entries li{
            border-bottom: 1px solid #ddd;
            padding: 1rem 0;
        }
        #login-history li{
            border-bottom: 1px solid #ddd;
            padding: .75rem 0;
        }
        .admin-panel {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 0.5rem;
            padding: 1.5rem;
            margin-top: 2rem;
        }
        body {
            padding-top: 56px;
        }
        .navbar-brand {
            font-family: "Pretendard", sans-serif;
            font-weight: 700;
        }
    </style>
    
    <script>
        window.KAKAO_JS_KEY = '9fd1b882e2cee4f435584bb9c3e3761c';
    </script>
    <meta name="kakao-key" content="9fd1b882e2cee4f435584bb9c3e3761c">
    <script src="https://developers.kakao.com/sdk/js/kakao.js"></script>
</head>
<body id="page-top">
    <!-- 내비게이션 바 -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-black fixed-top shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="#page-top">지환닷컴</a>
        </div>
    </nav>

    <!-- Intro / Hero -->
    <header class="masthead">
        <div class="container">
            <img src="./assets/profile_photo.jpg"
                alt="프로필 사진"
                style="width:15rem;border-radius:0.9rem;margin-bottom:3rem;">
            <h1 class="display-5 fw-semibold mb-3">변지환</h1>
            <p class="lead mb-0">💻 Computer Science and Engineering <br> AI system & Platform Engineering</p>
        </div>
    </header>

    <!-- Feature Selector -->
    <section class="py-5" id="hub">
        <div class="container">
            <h2 class="text-center fw-bold mb-5">둘러보기</h2>
            <div class="row g-4 justify-content-center">
                <div class="col-md-4 d-flex align-items-stretch">
                    <a href="portfolio.html" class="feature-card d-block text-center w-100">
                        <div class="feature-icon"><i class="fas fa-briefcase"></i></div>
                        <h5 class="fw-bold mb-1">포트폴리오</h5>
                        <p class="small mb-0">수상 & 프로젝트</p>
                    </a>
                </div>
                <div class="col-md-4 d-flex align-items-stretch">
                    <a href="apple_game/index.html" class="feature-card d-block text-center w-100">
                        <div class="feature-icon"><i class="fas fa-apple-alt"></i></div>
                        <h5 class="fw-bold mb-1">사과 게임</h5>
                        <p class="small mb-0">사과를 모아 Top 15 명예의 전당에 도전해 보세요!</p>
                    </a>
                </div>
                <div class="col-md-4 d-flex align-items-stretch">
                    <a href="nanobanana/index.html" class="feature-card d-block text-center w-100">
                        <div class="feature-icon"><i class="fas fa-palette text-warning"></i></div>
                        <h5 class="fw-bold mb-1">나노바나나</h5>
                        <p class="small mb-0">AI가 그려주는<br>나만의 귀여운 캐릭터 🍌</p>
                    </a>
                </div>
            </div>
        </div>
    </section>

    <!-- 방명록 -->
    <section class="py-5" id="guestbook">
        <div class="container">
            <h2 class="text-center mb-4">방명록 🗒️</h2>
            <div class="text-center mb-3">
                <button id="kakao-login" class="btn btn-warning">카카오 로그인</button>
                <button id="kakao-logout" class="btn btn-outline-dark d-none">로그아웃</button>
            </div>

            <!-- 댓글 작성 -->
            <form id="guestbook-form" class="mb-4">
                <textarea id="guestbook-content" class="form-control mb-2" rows="3" placeholder="내용을 입력하세요…" required></textarea>
                <button class="btn btn-dark w-100" type="submit">등록</button>
            </form>

            <!-- 댓글 목록 -->
            <ul id="guestbook-entries" class="list-unstyled"></ul>
        </div>
    </section>

    <!-- 관리자 모드 진입 -->
    <section class="py-5 bg-light" id="admin">
        <div class="container">
            <form id="admin-form" class="row g-2 justify-content-center">
                <div class="col-auto">
                    <input type="password" id="admin-pass" class="form-control" placeholder="관리자 비밀번호">
                </div>
                <div class="col-auto">
                    <button class="btn btn-outline-dark" type="submit">관리자 모드</button>
                </div>
            </form>

            <div id="admin-panel" class="admin-panel d-none">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="mb-0"><i class="fas fa-user-shield"></i> 관리자 패널</h4>
                    <button id="main-admin-logout-btn" class="btn btn-sm btn-danger">
                        <i class="fas fa-sign-out-alt"></i> 관리자 로그아웃
                    </button>
                </div>
                <a href="admin_memos.html" class="btn btn-info btn-sm mb-3 d-block">
                    <i class="fas fa-sticky-note me-1"></i> 관리자 메모 관리
                </a>
                
                <ul class="nav nav-tabs mb-3" id="admin-tabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="comments-tab" data-bs-toggle="tab" data-bs-target="#comments-panel" type="button">댓글 관리</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="logins-tab" data-bs-toggle="tab" data-bs-target="#logins-panel" type="button">로그인 이력</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="banana-tab" data-bs-toggle="tab" data-bs-target="#banana-panel" type="button">나노바나나 관리 🍌</button>
                    </li>
                </ul>

                <div class="tab-content" id="admin-tab-content">
                    <div class="tab-pane fade show active" id="comments-panel">
                        <p class="text-muted">댓글 목록에서 삭제 버튼이 활성화됩니다.</p>
                    </div>

                    <div class="tab-pane fade" id="logins-panel">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="mb-0">카카오 로그인 이력</h5>
                            <button id="refresh-logins" class="btn btn-sm btn-outline-primary">
                                <i class="fas fa-sync-alt"></i> 새로고침
                            </button>
                        </div>
                        <ul id="login-history" class="list-unstyled"></ul>
                    </div>

                    <div class="tab-pane fade" id="banana-panel">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="mb-0">🍌 나노바나나 생성 기록</h5>
                            <button id="refresh-bananas" class="btn btn-sm btn-warning text-white">
                                <i class="fas fa-sync-alt"></i> 새로고침
                            </button>
                        </div>
                        <div id="banana-list" class="row g-3" style="max-height: 500px; overflow-y: auto;">
                            <!-- Items will be injected here -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    
    <!-- Success Toast -->
    <div class="position-fixed bottom-0 end-0 p-3" style="z-index:1100">
        <div id="adminToast"
            class="toast align-items-center text-white bg-success border-0"
            role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                    ✅ 관리자 모드로 전환되었습니다.
                </div>
                <button type="button"
                        class="btn-close btn-close-white me-2 m-auto"
                        data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- JavaScript 파일 로드 -->
    <script src="app.js"></script>
</body>
</html>
