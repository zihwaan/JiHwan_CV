<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, user-scalable=no" />
    <title>사과 게임 - 지환닷컴</title>
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="../assets/img/증사.ico" />
    <!-- Fonts & Icons -->
    <script src="https://use.fontawesome.com/releases/v6.1.0/js/all.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <!-- Common Styles -->
    <link href="../css/styles.css" rel="stylesheet" />
    
    <style>
        body {
            background-color: #f7f7f7;
            font-family: "Pretendard", sans-serif;
            overflow: hidden; /* Prevent scrolling while dragging */
            touch-action: none; /* Important for drag */
        }
        


        /* Game Container */
        #game-wrapper {
            max-width: 500px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #fff;
            position: relative;
        }

        /* Header */
        header {
            padding: 15px;
            background: #2c3e50;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 10;
        }

        /* Grid */
        #grid-container {
            flex-grow: 1;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(17, 1fr); /* Adjust based on screen */
            gap: 2px;
            user-select: none;
            position: relative;
        }

        .apple {
            background-color: #ffcccb;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            color: #c0392b;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .apple.selected {
            background-color: #e74c3c;
            color: white;
            transform: scale(0.9);
        }
        .apple.removed {
            opacity: 0;
            pointer-events: none;
        }
        
        /* Drag Selection Box */
        #selection-box {
            position: absolute;
            border: 2px solid rgba(46, 204, 113, 0.8);
            background: rgba(46, 204, 113, 0.2);
            pointer-events: none;
            display: none;
            z-index: 5;
        }

        /* Overlays */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.95);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
        }
        .d-none { display: none !important; }

        .progress-bar { transition: width 1s linear; }

        /* Countdown Overlay */
        #countdown-overlay {
            background: rgba(255, 255, 255, 0.2) !important;
            backdrop-filter: blur(8px);
            z-index: 200; /* Higher than other overlays */
        }
        
        .countdown-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 250px;
            height: 250px;
        }

        .countdown-apple {
            font-size: 12rem;
            color: #ff6b6b; /* Cute red */
            filter: drop-shadow(0 10px 20px rgba(255, 107, 107, 0.4));
            z-index: 1;
        }

        .countdown-num {
            position: absolute;
            font-size: 6rem;
            font-weight: 900;
            color: white;
            z-index: 2;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            padding-bottom: 20px; /* Optical center adjustment */
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.5);
            }
            50% {
                opacity: 1;
                transform: scale(1.1);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        
        .animate-pop {
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        
        .animate-exit {
            animation: fadeOut 0.3s forwards;
        }
        
        @keyframes fadeOut {
            to { opacity: 0; transform: scale(1.5); }
        }
    </style>
    
    <!-- Kakao SDK -->
    <script src="https://developers.kakao.com/sdk/js/kakao.js"></script>
    <script>
        window.KAKAO_JS_KEY = '9fd1b882e2cee4f435584bb9c3e3761c'; 
    </script>
    <meta name="kakao-key" content="9fd1b882e2cee4f435584bb9c3e3761c">
</head>
<body>



    <div id="game-wrapper">
        <header>
            <div class="d-flex align-items-center gap-2">
                <i class="fas fa-clock"></i>
                <span id="timer" class="fw-bold fs-4">35</span>
            </div>
            <div class="d-flex flex-column align-items-end">
                <div class="d-flex align-items-center gap-2">
                    <span id="score" class="fw-bold fs-4 text-warning">0</span>
                    <i class="fas fa-star text-warning"></i>
                </div>
                
            </div>
        </header>
        
        <!-- Timer Bar -->
        <div class="progress" style="height: 5px; border-radius: 0;">
            <div id="time-bar" class="progress-bar bg-danger" role="progressbar" style="width: 100%;"></div>
        </div>

        <div id="grid-container">
            <!-- Apples generated by JS -->
            <div id="selection-box"></div>
        </div>

        <!-- Login Overlay -->
        <div id="login-overlay" class="overlay">
            <h1 class="display-4 fw-bold mb-3">🍎 사과 게임</h1>
            <p class="mb-4 text-muted">드래그해서 합이 10이 되면 점수 획득!</p>
            <button id="kakao-login-btn" class="btn btn-warning btn-lg shadow-sm mb-4">
                <i class="fas fa-comment"></i> 카카오 로그인
            </button>
            
            

            <!-- Embedded Leaderboard -->
            <div class="card w-100 shadow-sm" style="max-height: 250px; overflow-y: auto;">
                <div class="card-header bg-white fw-bold"><i class="fas fa-trophy text-warning"></i> 명예의 전당 (Top 15)</div>
                <div id="leaderboard-list-login" class="card-body p-0">
                    <div class="text-center py-3"><div class="spinner-border spinner-border-sm text-secondary"></div></div>
                </div>
            </div>
            
            <a href="../index.html" class="btn btn-link text-muted mt-3">나가기</a>
        </div>

        <!-- Start Overlay -->
        <div id="start-overlay" class="overlay d-none">
            <h2 class="mb-3">준비되셨나요?</h2>
            <p class="lead">제한시간 <b>35초</b> 동안<br>최대한 많은 사과를 없애세요!</p>
            <p class="text-muted small">내 최고 점수: <span id="my-best-score">0</span></p>
            <button id="game-start-btn" class="btn btn-primary btn-lg w-100 py-3 fw-bold shadow mb-4">게임 시작</button>
            
            

            <!-- Embedded Leaderboard -->
            <div class="card w-100 shadow-sm" style="max-height: 250px; overflow-y: auto;">
                <div class="card-header bg-white fw-bold"><i class="fas fa-trophy text-warning"></i> 명예의 전당 (Top 15)</div>
                <div id="leaderboard-list-start" class="card-body p-0">
                    <div class="text-center py-3"><div class="spinner-border spinner-border-sm text-secondary"></div></div>
                </div>
            </div>

            <a href="../index.html" class="btn btn-link text-muted mt-3">나가기</a>
        </div>

        <!-- Countdown Overlay -->
        <div id="countdown-overlay" class="overlay d-none">
            <div class="countdown-container">
                <i id="countdown-icon" class="fas fa-apple-whole countdown-apple"></i>
                <span id="countdown-text" class="countdown-num">3</span>
            </div>
        </div>

        <!-- Game Over / Top 15 Overlay -->
        <div id="result-overlay" class="overlay d-none">
            <h2 class="mb-2">Time Over!</h2>
            <h1 class="display-1 fw-bold mb-4" id="final-score">0</h1>
            
            <!-- Mandatory Message Input -->
            <div id="top10-form" class="w-100 d-none">
                <div class="alert alert-warning animate__animated animate__pulse animate__infinite">
                    🏆 <b>TOP 15 달성!</b> 🏆
                </div>
                <p class="mb-2">명예의 전당에 남길 소감을 입력해주세요.<br><span class="text-danger small">(필수 입력)</span></p>
                <input type="text" id="top10-msg" class="form-control mb-3 text-center" placeholder="소감 한마디 (최대 50자)" maxlength="50">
                <button id="submit-score-btn" class="btn btn-warning w-100 fw-bold">등록하기</button>
            </div>

            <!-- Normal Restart -->
            <div id="normal-actions">
                <button id="restart-btn" class="btn btn-dark btn-lg w-100 mb-2">다시 하기</button>
                <button id="go-home-btn" class="btn btn-outline-secondary w-100">처음으로</button>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
