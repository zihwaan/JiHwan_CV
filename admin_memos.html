<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 메모</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://webfontworld.github.io/pretendard/Pretendard.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary-color: #4a90e2; /* A calm blue for primary actions */
            --secondary-color: #f5f7fa; /* Light background for the page */
            --card-bg: #ffffff; /* White for cards */
            --text-color: #333333;
            --text-muted-color: #7f8c8d;
            --border-color: #e1e8ed;
            --shadow-color: rgba(0, 0, 0, 0.08);
            --hover-shadow-color: rgba(0, 0, 0, 0.15);
        }

        body {
            font-family: "Pretendard", sans-serif;
            background-color: var(--secondary-color);
            color: var(--text-color);
            padding-top: 2rem;
            padding-bottom: 2rem;
        }
        .container {
            max-width: 1000px;
        }
        header h1 {
            font-weight: 600;
            color: var(--primary-color);
        }
        .btn-custom-secondary {
            background-color: #6c757d;
            border-color: #6c757d;
            color: white;
        }
        .btn-custom-secondary:hover {
            background-color: #5a6268;
            border-color: #545b62;
        }

        #create-memo-section, #display-memos-section {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 0.75rem;
            box-shadow: 0 4px 12px var(--shadow-color);
            margin-bottom: 2rem;
        }
        
        h2 {
            font-weight: 500;
            margin-bottom: 1.5rem;
            color: var(--text-color);
        }

        .form-label {
            font-weight: 500;
            color: #555;
        }

        .form-control, .form-control-color {
            border-radius: 0.375rem;
            border: 1px solid var(--border-color);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .form-control:focus, .form-control-color:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(var(--primary-color), 0.25);
        }
        .form-control-color {
            min-width: 120px;
            height: calc(1.5em + 0.75rem + 2px);
            padding: 0.375rem; /* Adjusted padding */
        }

        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }
        .btn-primary:hover {
            background-color: #357abd;
            border-color: #357abd;
        }

        .memo-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border-radius: 0.5rem;
            box-shadow: 0 2px 8px var(--shadow-color);
            transition: box-shadow 0.2s ease-in-out, transform 0.2s ease-in-out;
            word-wrap: break-word;
        }
        .memo-box:hover {
            box-shadow: 0 6px 16px var(--hover-shadow-color);
            transform: translateY(-3px);
        }
        .memo-box h5 {
            font-weight: 500;
            color: var(--text-color);
            margin-bottom: 0.5rem;
        }
        .memo-box .timestamp {
            font-size: 0.8rem;
            color: var(--text-muted-color);
            margin-bottom: 1rem;
        }
        .memo-box p.card-text {
            white-space: pre-wrap;
            line-height: 1.6;
            margin-bottom: 1rem;
            color: #555;
        }
        .memo-actions {
            margin-top: 1rem;
            text-align: right;
        }
        .memo-actions .btn {
            margin-left: 0.5rem;
            font-size: 0.85rem;
            padding: 0.3rem 0.7rem;
        }
        .btn-warning { color: white; }
        .btn-danger { color: white; }

        hr {
            margin-top: 2.5rem;
            margin-bottom: 2.5rem;
            border-top: 1px solid var(--border-color);
        }
        .modal-header {
            background-color: var(--primary-color);
            color: white;
        }
        .modal-header .btn-close {
            filter: invert(1) grayscale(100%) brightness(200%);
        }
        .modal-title {
            font-weight: 500;
        }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--primary-color);
        }

        /* Markdown Styles */
        .markdown-body { font-size: 0.95rem; line-height: 1.6; word-break: break-word; color: #444; }
        .markdown-body img { max-width: 100%; height: auto; border-radius: 0.375rem; }
        .markdown-body pre { background: #f1f3f5; padding: 1rem; border-radius: 0.375rem; overflow-x: auto; font-size: 0.85rem; }
        .markdown-body code { font-family: monospace; background: #f1f3f5; padding: 0.2rem 0.4rem; border-radius: 0.25rem; color: #d63384; font-size: 0.85rem; }
        .markdown-body pre code { background: transparent; padding: 0; color: inherit; }
        .markdown-body blockquote { border-left: 4px solid #ced4da; padding-left: 1rem; color: #6c757d; margin-left: 0; margin-bottom: 1rem; font-size: 0.95rem; }
        .markdown-body table { width: 100%; margin-bottom: 1rem; color: #212529; border-collapse: collapse; font-size: 0.9rem; }
        .markdown-body table th, .markdown-body table td { padding: 0.5rem; border: 1px solid #dee2e6; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4, .markdown-body h5, .markdown-body h6 { margin-top: 1.5rem; margin-bottom: 0.5rem; font-weight: 600; color: #222; }
        .markdown-body h1 { font-size: 1.5rem; border-bottom: 1px solid #eaecef; padding-bottom: 0.3rem; }
        .markdown-body h2 { font-size: 1.3rem; border-bottom: 1px solid #eaecef; padding-bottom: 0.3rem; }
        .markdown-body h3 { font-size: 1.15rem; }
        .markdown-body h4 { font-size: 1.05rem; }
        .markdown-body p { margin-bottom: 0.8rem; }
    </style>
</head>
<body>
    <div class="container">
        <header class="page-header">
            <h1><i class="fas fa-clipboard-list me-2"></i>관리자 메모</h1>
            <a href="index.html" class="btn btn-custom-secondary"><i class="fas fa-arrow-left me-2"></i>메인으로 돌아가기</a>
        </header>

        <section id="create-memo-section">
            <h2><i class="fas fa-plus-circle me-2"></i>새 메모 작성</h2>
            <form id="create-memo-form">
                <div class="mb-3">
                    <label for="memo-title" class="form-label">제목</label>
                    <input type="text" class="form-control" id="memo-title" placeholder="메모 제목을 입력하세요" required>
                </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="memo-content" class="form-label">내용 (Markdown 지원)</label>
                        <textarea class="form-control" id="memo-content" rows="10" placeholder="마크다운으로 내용을 입력하세요" required></textarea>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">미리보기</label>
                        <div id="memo-preview" class="form-control markdown-body" style="height: 100%; min-height: 250px; overflow-y: auto; background-color: #f8f9fa;"></div>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="memo-color" class="form-label">색상</label>
                    <input type="color" class="form-control form-control-color" id="memo-color" value="#e9ecef" title="색상을 선택하세요">
                </div>
                <button type="submit" class="btn btn-primary"><i class="fas fa-save me-2"></i>메모 생성</button>
            </form>
        </section>

        <hr>

        <section id="display-memos-section">
            <h2><i class="fas fa-archive me-2"></i>메모 목록</h2>
            <div id="memos-container" class="d-flex flex-column gap-4">
                </div>
        </section>
    </div>

    <div class="modal fade" id="editMemoModal" tabindex="-1" aria-labelledby="editMemoModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editMemoModalLabel"><i class="fas fa-edit me-2"></i>메모 수정</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="닫기"></button>
                </div>
                <div class="modal-body">
                    <form id="edit-memo-form">
                        <input type="hidden" id="edit-memo-id">
                        <div class="mb-3">
                            <label for="edit-memo-title" class="form-label">제목</label>
                            <input type="text" class="form-control" id="edit-memo-title" required>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="edit-memo-content" class="form-label">내용 (Markdown 지원)</label>
                                <textarea class="form-control" id="edit-memo-content" rows="10" required></textarea>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">미리보기</label>
                                <div id="edit-memo-preview" class="form-control markdown-body" style="height: 100%; min-height: 250px; overflow-y: auto; background-color: #f8f9fa;"></div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="edit-memo-color" class="form-label">색상</label>
                            <input type="color" class="form-control form-control-color" id="edit-memo-color" title="색상을 선택하세요">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"><i class="fas fa-times me-2"></i>취소</button>
                    <button type="button" class="btn btn-primary" id="save-memo-changes-btn"><i class="fas fa-save me-2"></i>변경사항 저장</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <script src="js/admin_memos.js"></script>
</body>
</html>
